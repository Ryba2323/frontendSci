<!doctype html>
<html lang="pl" data-start="zalogowany" data-sciezka>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4FAFB">
  <title>ReLeaf — otwieranie Domu</title>
  <link rel="icon" type="image/png" href="img/favicon-64.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/start.css">
  <script src="js/theme.js"></script>
  <script src="js/start-character.js" defer></script>
  <script src="js/start.js" defer></script>
</head>
<body>
  <main class="start">
    <section class="start-screen" aria-label="Otwieranie ReLeaf">
      <span class="start-seed" aria-hidden="true"></span>
      <div class="start-art">
        <div class="start-figure">
          <div class="start-logo" role="img" aria-label="ReLeaf">
            <div class="start-character">
              <span class="start-shadow" aria-hidden="true"></span>
              <div class="start-peek-window">
                <img class="start-peek" src="img/listek.webp" alt="" width="360" height="255">
              </div>
              <div class="start-flight">
                <div class="start-mascot">
                  <img src="img/listek-hop.webp" alt="" width="360" height="476">
                </div>
              </div>
              <span class="start-landing" aria-hidden="true"></span>
              <span class="start-seed-rest" aria-hidden="true"></span>
            </div>
            <div class="start-word">
              <img class="start-logo-light" src="img/releaf-wordmark.webp" alt="" width="360" height="171">
              <img class="start-logo-dark" src="img/releaf-wordmark-dark.webp" alt="" width="360" height="171">
            </div>
          </div>
        </div>
      </div>
      <div class="start-actions">
        <a class="start-link" href="aplikacja.html#/dom" data-start-home>Przejdź do Domu</a>
      </div>
    </section>
  </main>
</body>
</html>
