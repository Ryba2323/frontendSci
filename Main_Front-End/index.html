  <!-- Spis ekranów prototypu (dla zespołu) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: var(--font); color: var(--text); background: linear-gradient(180deg, var(--bg), var(--bg-2)); -webkit-font-smoothing: antialiased; }
    main { max-width: 520px; margin: 0 auto; padding: 48px 20px; }
    h1 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
    p { margin: 0 0 24px; color: var(--text-muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    a {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 16px 18px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface);
      color: var(--text); text-decoration: none; font-weight: 700;
    }
    a:hover { border-color: var(--primary); }
    a small { font-weight: 500; color: var(--text-muted); }
  </style>
</head>
